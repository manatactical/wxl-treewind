; wxl-treewind configuration.
;
; Every knob the in-game "Tree Wind" panel exposes lives here too, so the sway can be retuned from a
; text editor. This file is read live while the client runs: after saving a change here the module
; notices within about a second and applies it, no restart and no overlay needed. The panel's Save
; button writes the current slider values back into this file.
;
; Values are clamped to the ranges the panel uses, so an out-of-range number will not break anything.
; Lines beginning with ';' are comments and are left alone by Save.

[TreeWind]

; --- master ---------------------------------------------------------------------------------
; 1 turns the sway on, 0 leaves every placed tree stock-still.
Enabled=1

; --- wind -----------------------------------------------------------------------------------
; Heading of the primary wave in the world XY plane, degrees.
Direction=35
; Wave travel speed, yards per second.
Speed=3
; Primary wave tilt at the crown, degrees. Keep this small (under ~2) for a breeze.
Amplitude=0.6
; Primary wave length, yards. Longer waves make broader, slower gusts.
Wavelength=26
; Constant downwind lean added on top of the wave, degrees.
Lean=0.25
; Secondary cross-swell tilt, degrees, and its length in yards.
CrossAmplitude=0.22
CrossWavelength=9
; Secondary wave heading offset from the primary, degrees.
CrossAngle=40
; Per-tree amplitude spread, 0 (uniform) .. 1 (about +/-50%).
Variance=0.5
; Slow gust modulation depth, 0 none .. 1 full.
Gust=0.35
; Per-yard sway attenuation with distance, 0 disables.
DistanceFade=0

; --- what sways -----------------------------------------------------------------------------
; 1 = only map-placed static doodads (never units, weapons or spell effects).
DoodadsOnly=1
; 1 = model path must contain a live-tree keyword (tree/pine/canopy/...).
MatchKeywords=1
; 1 = model bounds must be tall and narrow enough to read as a tree.
MatchTallThin=0
; 1 = reject dead, bare, burnt or felled trees (and loose tree parts like stumps and logs) even when
; they match a tree keyword. Keep on so only living trees sway.
ExcludeDead=1
; Every test enabled above must pass for a model to sway (AND). Turn one off to fall back to the
; other if a real tree is missed; keep both on to guarantee nothing but trees is touched.
; Tall-thin gate: minimum model-local height, yards.
MinHeight=6
; Tall-thin gate: height / widest horizontal extent.
MinAspect=1.8
; Skip trees taller than this, world yards. 0 = unlimited. Use this to leave giant trees rigid.
MaxHeight=200
; Ignore trees farther than this, yards. 0 = unlimited.
MaxDistance=0

[Bush]
; Bushes are the low, wide placed models the tree size filter is built to reject (bush/shrub/fern/
; hedge/...). They are matched by name only and never go through the tree tall-thin or max-height
; gates, so a bush sways even though its bounds look nothing like a tree's. The bush wind row below
; is entirely separate from the tree row, so low foliage can flutter harder and faster without
; touching the trees.

; --- master ---------------------------------------------------------------------------------
; 1 turns bush sway on, 0 leaves every placed bush stock-still.
Enabled=1

; --- bush wind (independent of the tree wind above) -----------------------------------------
Direction=35
Speed=3
; Primary wave tilt, degrees. Kept small so low foliage only flutters.
Amplitude=0.6
; Primary wave length, yards. Short, local waves.
Wavelength=9
; Constant downwind lean, degrees.
Lean=0.2
; Secondary cross-swell tilt, degrees, and its length in yards.
CrossAmplitude=0.25
CrossWavelength=5
CrossAngle=40
; Per-bush amplitude spread, 0 (uniform) .. 1 (about +/-50%).
Variance=0.6
; Slow gust modulation depth, 0 none .. 1 full.
Gust=0.4
; Per-yard sway attenuation with distance, 0 disables.
DistanceFade=0

; --- what sways -----------------------------------------------------------------------------
; 1 = only map-placed static doodads (never units or spell effects).
DoodadsOnly=1
; 1 = reject dead, bare or burnt bushes even when a bush keyword matches.
ExcludeDead=1
; Ignore bushes farther than this, yards. 0 = unlimited.
MaxDistance=0
